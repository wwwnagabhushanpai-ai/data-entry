<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Entry App</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Segoe UI,Arial,sans-serif;background:#f1f3f6;margin:0;padding:24px;color:#1b2430}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;margin:0 0 16px}
  .card{background:#fff;border:1px solid #d9dde3;border-radius:8px;padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px;color:#2f5d9e;text-transform:uppercase;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  label{display:block;font-size:12px;color:#556;margin-bottom:3px}
  input,select{width:100%;padding:8px;border:1px solid #b9c0ca;border-radius:5px;font-size:14px}
  input:focus,select:focus{outline:2px solid #2f5d9e44;border-color:#2f5d9e}
  .bad{border-color:#c0392b!important;background:#fff5f4}
  .actions{display:flex;gap:10px;align-items:center}
  button{padding:10px 22px;font-size:15px;border:0;border-radius:6px;cursor:pointer}
  .primary{background:#2f5d9e;color:#fff}
  .ghost{background:#e3e7ee;color:#1b2430}
  #msg{color:#c0392b;font-size:13px}
  #slip{display:none}
  .slip{background:#fff;border:1px solid #333;padding:22px 26px}
  .slip h2{margin:0 0 4px;font-size:20px;text-align:center}
  .slip .meta{display:flex;justify-content:space-between;font-size:13px;margin:10px 0 14px;border-top:2px solid #333;border-bottom:1px solid #999;padding:8px 0}
  .slip .pid{font-weight:700;font-size:16px;letter-spacing:1px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border:1px solid #555;padding:7px 9px;text-align:left}
  th{background:#eceff4}
  .foot{margin-top:40px;display:flex;justify-content:space-between;font-size:12px}
  .foot div{border-top:1px solid #333;padding-top:4px;width:40%;text-align:center}
  @media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}
  @media print{
    body{background:#fff;padding:0}
    #formView,h1{display:none!important}
    #slip{display:block!important}
    .slip{border:0}
    .noprint{display:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="formView">
    <h1>Data Entry</h1>
    <div id="rows"></div>
    <div class="actions">
      <button class="primary" id="submitBtn">Submit &amp; Print</button>
      <button class="ghost" id="clearBtn">Clear</button>
      <span id="msg"></span>
    </div>
  </div>

  <div id="slip">
    <div class="slip">
      <h2>Data Entry Record</h2>
      <div class="meta">
        <span>Print ID: <span class="pid" id="pPid"></span></span>
        <span id="pDate"></span>
      </div>
      <table>
        <thead><tr><th>SL</th><th>Name</th><th>Age</th><th>Gender</th><th>ID</th></tr></thead>
        <tbody id="pBody"></tbody>
      </table>
      <div class="foot"><div>Prepared by</div><div>Authorised signatory</div></div>
    </div>
    <div class="actions noprint" style="margin-top:14px">
      <button class="primary" onclick="window.print()">Print again</button>
      <button class="ghost" id="newBtn">New entry</button>
    </div>
  </div>
</div>

<script>
const N = 2;
const rowsEl = document.getElementById('rows');

for (let i = 1; i <= N; i++) {
  rowsEl.insertAdjacentHTML('beforeend', `
  <div class="card" data-i="${i}">
    <h2>SL ${i}</h2>
    <div class="grid">
      <div><label>Name</label><input type="text" id="name_${i}" class="f-name" maxlength="80"></div>
      <div><label>Age</label><input type="number" id="age_${i}" class="f-age" min="0" max="130"></div>
      <div><label>Gender</label>
        <select id="gender_${i}" class="f-gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
      <div><label>ID</label><input type="text" id="id_${i}" class="f-id" maxlength="40"></div>
    </div>
  </div>`);
}

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// Unique print ID: PR-YYYYMMDD-HHMMSS-<running no.>-<random>
function makePrintId() {
  const d = new Date(), p = (n,l=2)=>String(n).padStart(l,'0');
  let seq = 1;
  try {
    seq = (parseInt(localStorage.getItem('printSeq')||'0',10) || 0) + 1;
    localStorage.setItem('printSeq', seq);
  } catch(e) {}
  const rnd = Math.random().toString(36).slice(2,6).toUpperCase();
  return `PR-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${p(seq,4)}-${rnd}`;
}

function collect() {
  const out = []; let ok = true, any = false;
  document.querySelectorAll('.card').forEach(card => {
    const f = {
      name: card.querySelector('.f-name'), age: card.querySelector('.f-age'),
      gender: card.querySelector('.f-gender'), id: card.querySelector('.f-id')
    };
    Object.values(f).forEach(e => e.classList.remove('bad'));
    const v = {name:f.name.value.trim(), age:f.age.value.trim(), gender:f.gender.value, id:f.id.value.trim()};
    const filled = Object.values(v).some(x => x !== '');
    if (!filled) return;
    any = true;
    Object.keys(f).forEach(k => { if (!v[k]) { f[k].classList.add('bad'); ok = false; } });
    out.push({sl: card.dataset.i, ...v});
  });
  return {out, ok, any};
}

document.getElementById('submitBtn').onclick = () => {
  const msg = document.getElementById('msg');
  const {out, ok, any} = collect();
  if (!any) { msg.textContent = 'Enter at least one record.'; return; }
  if (!ok) { msg.textContent = 'Fill all four fields for each record you start.'; return; }
  msg.textContent = '';
  const pid = makePrintId();
  document.getElementById('pPid').textContent = pid;
  document.getElementById('pDate').textContent = new Date().toLocaleString();
  document.getElementById('pBody').innerHTML = out.map(r =>
    `<tr><td>${r.sl}</td><td>${esc(r.name)}</td><td>${esc(r.age)}</td><td>${esc(r.gender)}</td><td>${esc(r.id)}</td></tr>`).join('');
  document.getElementById('formView').style.display = 'none';
  document.getElementById('slip').style.display = 'block';
  document.title = pid;
  setTimeout(() => window.print(), 150);
};

document.getElementById('clearBtn').onclick = () => {
  document.querySelectorAll('input,select').forEach(e => { e.value = ''; e.classList.remove('bad'); });
  document.getElementById('msg').textContent = '';
};

document.getElementById('newBtn').onclick = () => {
  document.getElementById('clearBtn').click();
  document.getElementById('slip').style.display = 'none';
  document.getElementById('formView').style.display = 'block';
  document.title = 'Data Entry App';
};
</script>
</body>
</html>
